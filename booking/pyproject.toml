[tool.ruff]

line-length = 88
indent-width = 4
exclude = [".ipynb", "venv", "migrations", "tests"]


[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# I001 -sort imports
ignore = ["I001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]